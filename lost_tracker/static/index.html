<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindIt - Lost Item Tracker</title>
    <meta name="description" content="Track your lost items and discover what you need to replace most often.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="app-container">
        <!-- Auth Section -->
        <section id="auth-section" class="glass-card active">
            <h1 class="gradient-text">FindIt</h1>
            <p class="subtitle">Track what you lose. Replace what you need.</p>
            
            <div class="auth-tabs">
                <button id="tab-login" class="tab active" onclick="switchAuthTab('login')">Login</button>
                <button id="tab-register" class="tab" onclick="switchAuthTab('register')">Register</button>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required placeholder="Enter your username">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="primary-btn" id="auth-submit-btn">Login</button>
                <div id="auth-error" class="error-msg"></div>
            </form>
        </section>

        <!-- Dashboard Section -->
        <section id="dashboard-section" class="glass-card hidden">
            <header>
                <h2 class="gradient-text">Your Dashboard</h2>
                <button onclick="logout()" class="text-btn">Logout</button>
            </header>
            
            <div class="add-item-container">
                <h3>What did you lose today?</h3>
                <form id="add-item-form" onsubmit="handleAddItem(event)">
                    <div class="input-group flex-row">
                        <input type="text" id="new-item-name" required placeholder="e.g., AirPods, Umbrella, Wallet">
                        <button type="submit" class="primary-btn icon-btn">+</button>
                    </div>
                </form>
            </div>

            <div class="suggestion-container">
                <button onclick="getPurchaseSuggestion()" class="secondary-btn magic-btn">✨ What do I lose most?</button>
                <div id="suggestion-result" class="suggestion-box hidden">
                    <p id="suggestion-msg"></p>
                    <a id="suggestion-link" href="#" target="_blank" class="amazon-btn">🛒 Buy on Amazon</a>
                </div>
            </div>

            <div class="history-container">
                <h3>Recent Losses</h3>
                <ul id="items-list" class="items-list">
                    <!-- Items injected here -->
                </ul>
            </div>
        </section>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
